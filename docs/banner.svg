<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="ShakeReport: shake to report a bug on Android" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0f0a"/>
      <stop offset="1" stop-color="#431407"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="228" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">ShakeReport</text>
    <text x="82" y="282" fill="#fed7aa" font-size="27" font-weight="500">Shake the phone to report a bug: screenshot,</text>
    <text x="82" y="318" fill="#fed7aa" font-size="27" font-weight="500">markup, device info and logs. Kotlin · Compose</text>

    <g font-size="19" font-weight="600" fill="#fff7ed">
      <rect x="82" y="356" width="148" height="40" rx="20" fill="#ffffff" fill-opacity="0.1"/>
      <text x="156" y="382" text-anchor="middle">Screenshot</text>
      <rect x="242" y="356" width="112" height="40" rx="20" fill="#ffffff" fill-opacity="0.1"/>
      <text x="298" y="382" text-anchor="middle">Markup</text>
      <rect x="366" y="356" width="136" height="40" rx="20" fill="#ffffff" fill-opacity="0.1"/>
      <text x="434" y="382" text-anchor="middle">Device info</text>
      <rect x="514" y="356" width="90" height="40" rx="20" fill="#ffffff" fill-opacity="0.1"/>
      <text x="559" y="382" text-anchor="middle">Logs</text>
      <rect x="616" y="356" width="96" height="40" rx="20" fill="#f97316"/>
      <text x="664" y="382" text-anchor="middle" fill="#1c0f0a">Send</text>
    </g>

    <!-- shake motion lines -->
    <g stroke="#fb923c" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M842 170 q-22 30 0 60"/>
      <path d="M816 150 q-34 50 0 100" stroke-opacity="0.55"/>
      <path d="M1158 330 q22 30 0 60"/>
      <path d="M1184 310 q34 50 0 100" stroke-opacity="0.55"/>
    </g>

    <g filter="url(#shadow)" transform="rotate(-6 1000 280)">
      <rect x="870" y="60" width="260" height="440" rx="34" fill="#111827"/>
      <rect x="882" y="72" width="236" height="416" rx="26" fill="#fffbf7"/>
      <text x="902" y="112" fill="#1f2937" font-size="19" font-weight="700">Report a bug</text>
      <!-- screenshot thumbnail with pen markup -->
      <rect x="902" y="130" width="84" height="150" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
      <rect x="912" y="146" width="64" height="10" rx="5" fill="#d1d5db"/>
      <rect x="912" y="166" width="48" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="912" y="182" width="56" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="912" y="222" width="30" height="10" rx="5" fill="#9ca3af"/>
      <rect x="946" y="222" width="26" height="10" rx="5" fill="#374151"/>
      <ellipse cx="958" cy="227" rx="22" ry="13" fill="none" stroke="#e53935" stroke-width="3"/>
      <text x="1000" y="150" fill="#1f2937" font-size="14" font-weight="700">Screenshot</text>
      <rect x="1000" y="164" width="90" height="28" rx="14" fill="#ffdbcc"/>
      <text x="1045" y="183" fill="#3a0b00" font-size="13" font-weight="600" text-anchor="middle">Mark up</text>
      <rect x="902" y="298" width="196" height="64" rx="10" fill="none" stroke="#9ca3af"/>
      <text x="914" y="322" fill="#374151" font-size="12">Total adds the discount</text>
      <text x="914" y="340" fill="#374151" font-size="12">instead of subtracting it.</text>
      <text x="902" y="386" fill="#6b7280" font-size="11">Pixel 8 · Android 16 · v2.3.0</text>
      <text x="902" y="404" fill="#6b7280" font-size="11">Battery 87% · 3.0 GB free</text>
      <rect x="902" y="428" width="196" height="40" rx="20" fill="#b7410e"/>
      <text x="1000" y="453" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Share report</text>
    </g>
  </g>
</svg>
